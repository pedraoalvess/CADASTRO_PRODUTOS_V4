<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque - POO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Cadastro de Produtos</h1>

        <!--Formulário de Entrada-->
        <form id="produto-form" novalidate>
            <div class="form-group">
                <label for="nome">Nome do produto:</label>
                <input type="text" id="nome" placeholder="Ex. Notebook" />
            </div>

            <div class="form-group">
                <label for="preco">Preço (R$):</label>
                <input type="number" id="preco" step="0.01" placeholder="Ex. 3500.00" />
            </div>

            <div class="form-group">
                <label for="quantidade">Quantidade:</label>
                <input type="number" id="quantidade" placeholder="Ex. 5" />
            </div>

            <button type="submit" class="btn-primary">Adicionar Produto</button>
        </form>

        <!--Cabeçalho de Ações e Resumo-->
        <div class="resumo-container">
            <h3 id="total-estoque">Total em Estoque: R$0,00</h3>
            <button id="limpar-tabela" class="btn-danger">Limpar</button>
        </div>

        <!-- V4: Campo de pesquisa dinâmica -->
        <div class="form-group busca-group">
            <label for="campo-busca">Pesquisar produto:</label>
            <input type="text" id="campo-busca" placeholder="Digite parte do nome..." />
        </div>

        <!--Tabela de Exibição-->
        <table id="tabela-produtos">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Preço</th>
                    <th>Qtd</th>
                    <th>Subtotal</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <!--As linhas da tabela serão inseridas através do Js-->
            </tbody>
        </table>
    </div>

    <script src="script.js"></script>

    <h2 class="titulo-autores">Feito por</h2>
    <div class="autores">
    <div class="autor">
        <img src="eu.webp" alt="Foto de Pedro Alves">
        <p>Pedro Alves</p>
    </div>

    <div class="autor">
        <img src="avatar.webp" alt="Foto de Gabriel Wilsek Mendes Dorado">
        <p>Gabriel Wilsek</p>
    </div>
    </div>
    
</body>

</html>
